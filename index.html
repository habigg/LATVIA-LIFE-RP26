<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>LATVIA LIFE RP</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    header {
      padding: 24px 16px;
      text-align: center;
      background: #172438;
      border-bottom: 3px solid #39b86b;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      color: #b8c7d9;
      margin-bottom: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px 14px;
    }

    .welcome {
      padding: 22px;
      border-radius: 14px;
      background: #1b2b40;
      margin-bottom: 22px;
    }

    .welcome h2 {
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      background: #1b2b40;
      border: 1px solid #31445c;
      padding: 18px 12px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      color: white;
      font-size: 16px;
    }

    .card:hover {
      background: #263c55;
    }

    .icon {
      font-size: 30px;
      display: block;
      margin-bottom: 10px;
    }

    #info {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #1b2b40;
      border-radius: 12px;
    }

    footer {
      text-align: center;
      padding: 24px 12px;
      color: #9aabc0;
      font-size: 13px;
    }

    @media (min-width: 600px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🇱🇻 LATVIA LIFE RP</h1>
    <p>Tava virtuālā dzīve Latvijā</p>
  </header>

  <main class="container">
    <section class="welcome">
      <h2>Sveicināts Latvijā!</h2>
      <p>Izvēlies, ko vēlies darīt savā virtuālajā dzīvē.</p>
      <p>💶 Nauda: <strong id="money">500 €</strong></p>
      <p>👤 Spēlētājs: <strong id="player">Viesis</strong></p>
    </section>

    <section class="grid">
      <button class="card" onclick="openSection('CSDD')">
        <span class="icon">🚗</span>CSDD
      </button>
      <button class="card" onclick="openSection('Policija')">
        <span class="icon">👮</span>Policija
      </button>
      <button class="card" onclick="openSection('Banka')">
        <span class="icon">🏦</span>Banka
      </button>
      <button class="card" onclick="openSection('Slimnīca')">
        <span class="icon">🏥</span>Slimnīca
      </button>
      <button class="card" onclick="openSection('Darbs')">
        <span class="icon">💼</span>Darbs
      </button>
      <button class="card" onclick="openSection('Īpašumi')">
        <span class="icon">🏠</span>Īpašumi
      </button>
      <button class="card" onclick="openSection('Automašīnas')">
        <span class="icon">🚘</span>Automašīnas
      </button>
      <button class="card" onclick="openSection('Dokumenti')">
        <span class="icon">🪪</span>Dokumenti
      </button>
      <button class="card" onclick="openSection('Veikali')">
        <span class="icon">🛒</span>Veikali
      </button>
    </section>

    <section id="info">
      <h2 id="sectionTitle"></h2>
      <p id="sectionText"></p>
      <button class="card" onclick="closeSection()">⬅ Atpakaļ</button>
    </section>
  </main>

  <footer>
    LATVIA LIFE RP © 2026 · Virtuāla lomu spēle
  </footer>

  <script>
    function openSection(name) {
      const descriptions = {
        'CSDD': 'Šeit būs transportlīdzekļu reģistrācija, vadītāja apliecības un braukšanas eksāmeni.',
        'Policija': 'Šeit būs policijas darbs, pakāpes, patruļas un virtuālie sodi.',
        'Banka': 'Šeit būs spēlētāja konts, nauda, algas un pārskaitījumi.',
        'Slimnīca': 'Šeit būs ārstu darbs, ārstēšana un neatliekamā palīdzība.',
        'Darbs': 'Šeit varēsi izvēlēties profesiju un nopelnīt virtuālo naudu.',
        'Īpašumi': 'Šeit varēsi iegādāties virtuālas mājas, dzīvokļus un uzņēmumus.',
        'Automašīnas': 'Šeit būs automašīnu veikals, remonts un transportlīdzekļu pārvaldība.',
        'Dokumenti': 'Šeit būs tavi virtuālie personas dokumenti un atļaujas.',
        'Veikali': 'Šeit varēsi iegādāties virtuālas preces un citus priekšmetus.'
      };

      document.getElementById('sectionTitle').textContent = name;
      document.getElementById('sectionText').textContent = descriptions[name];
      document.getElementById('info').style.display = 'block';
      document.getElementById('info').scrollIntoView({ behavior: 'smooth' });
    }

    function closeSection() {
      document.getElementById('info').style.display = 'none';
    }
  </script>
</body>
</html>
